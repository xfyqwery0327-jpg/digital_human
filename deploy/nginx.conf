# 数字讲解员 nginx 反向代理配置（Windows，独立部署版）。
# 注意：本机（展厅机）nginx 已安装在 E:\nginx-1.22.1，服务已并入其 conf/nginx.conf，
#   统一前缀 /dh/，监听 8388（与其它业务同口）。本文件是「单独一台 nginx」时的替代方案。
#   本机实际生效的规则以 E:\nginx-1.22.1\conf\nginx.conf 为准。
#
# 独立部署用法：
#   1. 下载 nginx Windows 版并解压，例如 C:\nginx
#      https://nginx.org/en/download.html
#   2. 用本文件替换 C:\nginx\conf\nginx.conf，重载：
#      cd C:\nginx && nginx -t && nginx -s reload
#   3. （可选）注册为服务，和讲解员一样用 NSSM：
#      nssm install nginx C:\nginx\nginx.exe
#      nssm set nginx AppDirectory C:\nginx
#      nssm set nginx Start SERVICE_AUTO_START
#   4. 防火墙放行 80（LLM 入口 8081 按需放行）。
#
# 入口：http://<主机>/            → 讲解员 8848（API + WebSocket）
#       http://<主机>:8081/       → LLM 8080（llama_cpp.server，内网可选）
#       ws://<主机>/ws/...        → 讲解员 WebSocket（tts / chat）
#
# 注意：
#   - 8810 是讲解员内部调用的独立 TTS 进程，只绑 127.0.0.1，不要在这里暴露。
#   - 若所有访问都走 nginx，可把讲解员改回只听 127.0.0.1
#     （start-server.ps1 里 MONET_HOST=127.0.0.1，或 NSSM 环境变量同步改），
#     8080 保持 127.0.0.1 不变，由 nginx 转发。
#   - 加 HTTPS 时，把下面 server 80 块改成 listen 443 ssl; 并补
#     ssl_certificate / ssl_certificate_key，再加一个 80 跳转块即可；
#     WebSocket 用 wss://，其余配置不用动。

worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    access_log    logs/access.log;

    sendfile           on;
    keepalive_timeout  65;
    # 讲解员是长连接流式场景，关闭 gzip，避免缓冲/压缩拖慢或卡住 WS 与流式响应
    gzip               off;

    # WebSocket 升级头。带 Upgrade 的请求 Connection: upgrade，普通请求 close。
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # 机器人上传参考音等 WAV，放宽请求体上限
    client_max_body_size 100m;

    # ---------- 讲解员对外入口：API + WebSocket 都走 80 ----------
    server {
        listen       80;
        server_name  _;   # 有域名就改成域名，如 dh.local

        location / {
            proxy_pass       http://127.0.0.1:8848;
            proxy_http_version 1.1;

            # WebSocket / 长连接必需
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 透传真实客户端，供 robot_id 日志 / X-Robot-Token 鉴权使用
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 关闭缓冲：WS 帧、TTS 流式 chunk、SSE 都要即时透传
            proxy_buffering off;

            # 讲解一轮 + 口播可能跨分钟，WS 连接更可能长时间空闲；超时放到 1 小时
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
            send_timeout        1h;
        }
    }

    # ---------- LLM 入口（llama_cpp.server :8080）----------
    # 只给内网调试 / 联调用。不需要就整块删掉。
    server {
        listen       8081;
        server_name  _;

        location / {
            proxy_pass       http://127.0.0.1:8080;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # llama_cpp.server 支持流式补全，同样关缓冲
            proxy_buffering off;
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
        }
    }
}
