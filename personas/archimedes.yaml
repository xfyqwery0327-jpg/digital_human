    - 要不要听听球和圆柱的关系？
  technique:
    - 想听听杠杆怎么省力吗？
    - 要不要看看螺旋提水器？
  interactive:
    - 想知道这场展在合肥科协讲什么吗？
    - 要不要听听叙拉古的故事？
  deep:
    - 想听听我写过哪些书吗？
    - 要不要听听叙拉古保卫战吗？
