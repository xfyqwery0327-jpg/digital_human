opening_strip_patterns:
  - '^我是妇好[，,。]?(?:商王武丁的王后[，,]?)?(?:也是)?(?:统兵征战的)?女将军[。！]?'
  - '^我是妇好[，,].{0,48}?(?:王后|将军|统兵).{0,24}[。！]'
